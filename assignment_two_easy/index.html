<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>ScaleX Landing Page [A2] easy</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<header>
			<div class="logo">
				<img src="./images/logo.webp" alt="logo-image" />
				<p>ScaleX</p>
			</div>
			<nav>
				<a href="#">Home</a><a href="#">About Us</a><a href="#">Blogs</a
				><a href="#">Contact Us</a>
			</nav>
			<button>Get Started</button>
		</header>
		<main>
			<section class="hero">
				<h1>Insights & Blogs</h1>
			</section>

			<section class="filters">
				<button class="active">All</button><button>Tech</button
				><button>Saas</button><button>Marketing</button>
			</section>

			<section class="cards">
				<div class="card">
                    <img
                        src="./images/red_aesthetic_drink.png"
                        alt="red_aesthetic_drink"
                    />
					<div class="text_content">
						<span>Tech</span>
						<h2>The Ultimate Guide To <br> Saas Marketing</h2>
						<p>May 23, 2025</p>
					</div>
				</div>
				<div class="card">
                    <img
                        src="./images/orange_chair.png"
                        alt="red_aesthetic_drink"
                    />
					<div class="text_content">
						<span>SaaS</span>
						<h2>5 Key Trends In SaaS <br> Growth for 2025</h2>
						<p>May 23, 2025</p>
					</div>
				</div>
				<div class="card">
                    <img
                        src ="./images/Tabby Cat on Yellow Background.png"
                        alt="red_aesthetic_drink"
                    />
					<div class="text_content">
						<span>Marketing</span>
						<h2>How Data-Driven <br> Strategies are Important</h2>
						<p>May 23, 2025</p>
					</div>
				</div>
			</section>
		</main>
	</body>
</html>
