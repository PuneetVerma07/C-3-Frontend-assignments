<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Art work card [A-3-easy landing page]</title>
		<link
			href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<main>
			<header class="heading">
				<h1>Explore Art Work</h1>
				<p>See All</p>
			</header>
			<section class="cards">
				<div class="card">
					<img src="./assets/images/MONUME.jpeg" alt="deadpool image" />
					<div class="text-content">
						<h2>Monocular</h2>
						<p>54.8k <span><i class="ri-heart-3-line"></i></span></p>
					</div>
                    <button>Place Bid</button>
				</div>
				<div class="card">
					<img src="./assets/images/HomsMask.jpeg" alt="deadpool image" />
					<div class="text-content">
						<h2>Homes Mask</h2>
						<p>32.4k <span><i class="ri-heart-3-line"></i></span></p>
					</div>
                    <button>Place Bid</button>
				</div>
				<div class="card">
					<img src="./assets/images/san-limo.jpg" alt="deadpool image" />
					<div class="text-content">
						<h2>Light Moon</h2>
						<p>55.6k <span><i class="ri-heart-3-line"></i></span></p>
					</div>
                    <button>Place Bid</button>
				</div>
				<div class="card">
					<img src="./assets/images/Servo Skull.jpeg" alt="deadpool image" />
					<div class="text-content">
						<h2>Skull Wire</h2>
						<p>78.9k <span><i class="ri-heart-3-line"></i></span></p>
					</div>
                    <button>Place Bid</button>
				</div>
				<div class="card">
					<img src="./assets/images/spiderman.jpeg" alt="deadpool image" />
					<div class="text-content">
						<h2>Spiderman</h2>
						<p>24.8k <span><i class="ri-heart-3-line"></i></span></p>
					</div>
                    <button>Place Bid</button>
				</div>
				<div class="card">
					<img src="./assets/images/Deadpool Punk.jpeg" alt="deadpool image" />
					<div class="text-content">
						<h2>Dead Pool</h2>
						<p>59.7k <span><i class="ri-heart-3-line"></i></span></p>
					</div>
                    <button>Place Bid</button>
				</div>
				<div class="card">
					<img src="./assets/images/Gojo Satoru.jpeg" alt="deadpool image" />
					<div class="text-content">
						<h2>Gojo Satoru</h2>
						<p>45.7k <span><i class="ri-heart-3-line"></i></span></p>
					</div>
                    <button>Place Bid</button>
				</div>
				<div class="card">
					<img src="./assets/images/tony ironman.jpeg" alt="deadpool image" />
					<div class="text-content">
						<h2>Tony Stark</h2>
						<p>80.9k <span><i class="ri-heart-3-line"></i></span></p>
					</div>
                    <button>Place Bid</button>
				</div>
			</section>
            <div class="dot dot1"></div>
            <div class="dot dot2"></div>
            <div class="dot dot3"></div>
            <div class="dot dot4"></div>
            <div class="dot dot5"></div>
            <div class="dot dot6"></div>
		</main>
	</body>
</html>
